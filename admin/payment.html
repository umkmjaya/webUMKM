<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>webUMKM — Pembayaran</title><link rel="stylesheet" href="style.css"><style>body{min-height:100vh;display:grid;place-items:center}.pay{width:min(460px,92vw);text-align:center}.qr{display:grid;place-items:center;margin:22px auto;padding:18px;background:#fff;border:1px solid #ddd;border-radius:18px;width:max-content}.qr canvas{max-width:280px;height:auto}.amount{font-size:30px;font-weight:800}.muted{color:#666}.success{font-size:20px;font-weight:700}.danger{color:#b42318}</style></head><body><main class="pay"><div class="panel"><p class="eyebrow">WEBUMKM · QRIS</p><h1 id="title">Menyiapkan pembayaran...</h1><p id="amount" class="amount"></p><div id="qr" class="qr" hidden><canvas id="canvas" width="280" height="280"></canvas></div><p id="status" class="muted">Mohon tunggu.</p><p id="expiry" class="muted"></p><button id="back" class="outline" type="button">Kembali ke Dashboard</button></div></main><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script>(async()=>{const p=new URLSearchParams(location.search),slug=p.get('slug'),orderId=p.get('order'),$=id=>document.getElementById(id),money=n=>'Rp'+Number(n||0).toLocaleString('id-ID');if(!slug||!orderId){$('title').textContent='Pembayaran tidak ditemukan';$('status').textContent='Link pembayaran tidak lengkap.';return}$('back').onclick=()=>location.href='index.html';async function load(){const r=await fetch('../api/orders?slug='+encodeURIComponent(slug),{cache:'no-store'});if(r.status===401){location.href='login.html';return null}const d=await r.json();return(d.orders||[]).find(x=>x.id===orderId)}let order=await load();if(!order){$('title').textContent='Order tidak ditemukan';$('status').textContent='Pastikan Anda login dengan akun pemilik website.';return}function render(){ $('amount').textContent=money(order.amount);if(order.status==='paid'){ $('title').textContent='Pembayaran berhasil ✓';$('status').textContent='Website Anda sedang/ sudah aktif. Anda dapat kembali ke dashboard.';$('status').className='success';$('qr').hidden=true;return }if(order.status==='failed'||order.status==='payment_error'){ $('title').textContent='Pembayaran gagal';$('status').textContent='Silakan buat order baru atau periksa konfigurasi pembayaran.';$('status').className='danger';$('qr').hidden=true;return }$('title').textContent='Scan QRIS untuk membayar';if(order.payment_qr&&window.QRCode){QRCode.toCanvas($('canvas'),order.payment_qr,{width:280,margin:1},e=>{if(e){$('status').textContent='QR tidak dapat ditampilkan.'}else{$('qr').hidden=false;$('status').textContent='Scan QR dengan aplikasi pembayaran Anda. Setelah membayar, status akan diperbarui otomatis.'}})}else{$('status').textContent='QR pembayaran belum tersedia.'} }render();setInterval(async()=>{const next=await load();if(next){order=next;render()}},5000)})()</script></body></html>
