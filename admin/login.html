<!doctype html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>webUMKM — Masuk</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app" style="min-height:100vh;display:grid;place-items:center"><main style="width:min(440px,92vw)"><div class="panel"><p class="eyebrow">WEBUMKM</p><h1>Masuk ke dashboard</h1><p>Kelola website, pesanan, pembayaran dan referral dari satu tempat.</p><label>Email<input id="email" type="email" autocomplete="email" placeholder="nama@email.com"></label><label>Password<input id="password" type="password" autocomplete="current-password" placeholder="Minimal 8 karakter"></label><button id="login" class="primary">Masuk</button><p id="status" class="status"></p><hr><p>Belum punya akun?</p><button id="register" class="outline">Daftar akun baru</button></div></main></div>
<script>
const $=id=>document.getElementById(id); const status=$('status');
$('login').onclick=async()=>{status.textContent='Memproses...';try{const r=await fetch('../api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.message||'Gagal masuk');location.href='index.html';}catch(e){status.textContent=e.message}};
$('register').onclick=()=>{location.href='register.html'};
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('login').click()});
</script></body></html>
