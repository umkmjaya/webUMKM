<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order — webUMKM</title><style>body{font-family:Arial,sans-serif;background:#f7f5f1;margin:0;padding:30px;color:#171717}.box{max-width:620px;margin:auto;background:#fff;padding:32px;border-radius:22px}.eyebrow{color:#d97706;font-weight:700;font-size:12px;letter-spacing:.12em}h1{font-size:38px}label{display:block;font-weight:700;margin:18px 0}input{width:100%;padding:13px;margin-top:7px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}.summary{background:#f7f5f1;padding:18px;border-radius:14px}.btn{border:0;background:#171717;color:#fff;padding:14px 20px;border-radius:10px;font-weight:700;width:100%;cursor:pointer}.ok{padding:15px;background:#e9f8ed;border-radius:12px}.err{padding:15px;background:#fff0f0;border-radius:12px}</style></head><body><div class="box"><p class="eyebrow">ORDER WEBSITE UMKM</p><h1>Pesan website Anda</h1><div class="summary"><strong id="packageName">Paket</strong><br><span id="amount">Rp0</span></div><label>Nama pemesan<input id="customerName" placeholder="Nama lengkap"></label><label>No. WhatsApp<input id="customerPhone" placeholder="08xxxxxxxxxx"></label><label>Kode referral <small>(opsional)</small><input id="referralCode" placeholder="Kode dari teman"></label><button class="btn" id="submit">Buat Order</button><div id="result" style="margin-top:16px"></div></div><script>const p=new URLSearchParams(location.search),slug=p.get('slug')||'',pkg=p.get('package')||'starter',prices={starter:15000,growth:25000,business:45000,pro:85000};const names={starter:'Starter',growth:'Growth',business:'Business',pro:'Pro'};document.querySelector('#packageName').textContent=names[pkg]||'Paket';document.querySelector('#amount').textContent='Rp'+(prices[pkg]||0).toLocaleString('id-ID');document.querySelector('#submit').onclick=async()=>{const result=document.querySelector('#result');result.textContent='Memproses...';try{const r=await fetch('../api/orders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({slug,packageCode:pkg,customerName:document.querySelector('#customerName').value,customerPhone:document.querySelector('#customerPhone').value,referralCode:document.querySelector('#referralCode').value})});const d=await r.json();if(!r.ok)throw Error(d.message||'Gagal membuat order');result.className='ok';result.innerHTML='<strong>Order berhasil dibuat.</strong><br>ID Order: '+d.orderId+'<br>Total: Rp'+d.amount.toLocaleString('id-ID')+'<br><br>Status: menunggu pembayaran.'}catch(e){result.className='err';result.textContent=e.message}}</script></body></html>
